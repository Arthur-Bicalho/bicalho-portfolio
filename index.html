<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!-- Favicon: SVG nos navegadores atuais, .ico de reserva e ícone da tela de início do iOS -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arthur Bicalho Angelo</title>
    <meta
      name="description"
      content="Estudante de Ciência da Computação na PUC Minas e funcionário Webtech."
    />
    <meta name="author" content="Arthur Bicalho Angelo" />
    <!-- Links com ?cmd= e ?lang= apontam para a mesma página -->
    <!-- TODO: troque arthur-bicalho.vercel.app pelo endereço que a Vercel der ao projeto -->
    <link rel="canonical" href="https://arthur-bicalho.vercel.app/" />

    <!-- Prévia do link (WhatsApp, LinkedIn, Slack, Telegram...) -->
    <!-- Os crawlers não rodam JavaScript: as tags precisam estar aqui, no HTML -->
    <!-- A imagem precisa de URL absoluta -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="arthur-bicalho.vercel.app" />
    <meta property="og:url" content="https://arthur-bicalho.vercel.app/" />
    <meta property="og:title" content="Arthur Bicalho Angelo · Portfólio Terminal" />
    <meta
      property="og:description"
      content="Estudante de Ciência da Computação na PUC Minas e funcionário Webtech."
    />
    <meta property="og:image" content="https://arthur-bicalho.vercel.app/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Tela inicial do portfólio em estilo terminal, com nome, cargos e o prompt visitante@portfolio"
    />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:locale:alternate" content="en_US" />

    <!-- X/Twitter: imagem grande; título, descrição e imagem vêm das tags og: -->
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Aplica o tema salvo antes do React carregar (evita piscar o dark).
         A Content-Security-Policy (vercel.json) libera este script pelo hash
         sha256 do conteúdo: ele fica numa linha só para o hash não mudar com
         o fim de linha (CRLF no Windows, LF na Vercel). Mudou uma letra aqui,
         gere o hash de novo (ver o comentário em vite.config.js). -->
    <script>try{var saved=localStorage.getItem("bicalho-theme");if(saved==="light"||saved==="galo"){document.documentElement.dataset.theme=saved}}catch(e){}</script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
